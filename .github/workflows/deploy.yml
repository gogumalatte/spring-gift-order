name: Deploy to AWS EC2 without deploy.sh

on:
  push:
    branches:
      - step3

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v3

      - name: Set up JDK 21
        uses: actions/setup-java@v3
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Grant execute permission for gradlew
        run: chmod +x ./gradlew

      - name: Build with Gradle
        run: ./gradlew build -x test

      - name: Kill existing process and clean up
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.AWS_EC2_HOST }}
          username: ${{ secrets.AWS_EC2_USERNAME }}
          key: ${{ secrets.AWS_SSH_PRIVATE_KEY }}
          script: |
            # 실행 중인 jar 파일이 있으면 종료
            pgrep -f 'spring-gift-0.0.1-SNAPSHOT.jar' | xargs -r kill -9

            # 기존 jar 파일 삭제 (선택 사항)
            rm -f /home/ubuntu/*.jar
            
            # 기존 로그 파일 삭제
            rm -f /home/ubuntu/log/deploy.log

      - name: Transfer JAR to EC2
        uses: appleboy/scp-action@master
        with:
          host: ${{ secrets.AWS_EC2_HOST }}
          username: ${{ secrets.AWS_EC2_USERNAME }}
          key: ${{ secrets.AWS_SSH_PRIVATE_KEY }}
          source: "build/libs/spring-gift-0.0.1-SNAPSHOT.jar"
          target: "/home/ubuntu"

      - name: Execute remote commands
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.AWS_EC2_HOST }}
          username: ${{ secrets.AWS_EC2_USERNAME }}
          key: ${{ secrets.AWS_SSH_PRIVATE_KEY }}
          script: |
            # 로그 디렉토리가 없으면 생성
            if [ ! -d "/home/ubuntu/log" ]; then
              mkdir /home/ubuntu/log
            fi
            
            # 새 애플리케이션 실행
            nohup java -Xmx512m -jar \
              -Dspring.profiles.active=prod \
              -Dkakao.client.id=${{ secrets.KAKAO_CLIENT_ID }} \
              -Dkakao.redirect.uri=${{ secrets.KAKAO_REDIRECT_URI }} \
              /home/ubuntu/spring-gift-0.0.1-SNAPSHOT.jar \
              > /home/ubuntu/log/deploy.log 2>&1 &